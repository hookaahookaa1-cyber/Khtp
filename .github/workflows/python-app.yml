name: BRR Strategy Tests

on:
push:
branches:
- main
pull_request:
branches:
- main
workflow_dispatch:

permissions:
contents: read

jobs:
test-brr:
runs-on: ubuntu-latest
steps:
- name: Checkout repository
uses: actions/checkout@v4

  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.11"

  - name: Install test dependencies
    run: |
      python -m pip install --upgrade pip
      pip install pandas pytest

  - name: Run BRR tests
    run: python -m pytest -v test_brr_strategy.py
